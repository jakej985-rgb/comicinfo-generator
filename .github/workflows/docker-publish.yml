name: Build and Publish Docker Image

on:
  push:
    branches: [ "v0.1", "main" ]
    tags: [ "v*" ]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.title=ComicInfo Generator & Tagger
            org.opencontainers.image.description=A web application and CLI tool to automatically scrape comic metadata from Comic Vine and GCP, convert .cbr to .cbz, and embed ComicInfo.xml metadata files.
          annotations: |
            org.opencontainers.image.title=ComicInfo Generator & Tagger
            org.opencontainers.image.description=A web application and CLI tool to automatically scrape comic metadata from Comic Vine and GCP, convert .cbr to .cbz, and embed ComicInfo.xml metadata files.
          tags: |
            type=raw,value=v0.1,enable=${{ github.ref == 'refs/heads/v0.1' || github.ref == 'refs/tags/v0.1' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/v0.1' || github.ref == 'refs/tags/v0.1' || github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
