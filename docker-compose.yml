version: '3.8'

services:
  comicinfo-generator:
    build: .
    image: ghcr.io/jakej985-rgb/comicinfo-generator:v0.1
    container_name: comicinfo-generator
    ports:
      - "5005:5005"
    volumes:
      # Required: Mount host comic library directory to embed metadata into archives
      - ./comics:/comics
    restart: unless-stopped
